<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style/calculator.css">
    
</head>

<body>

    <section class="calculator">

        <div class="display"></div>

        <div class="btn-section"> 

        <div class="number-btns">

            <div class="firstl">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            </div>

            <div class="secondl">
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            </div>

        </div>




        <div class="operands">
        <button>+</button>
        <button>-</button>
        <button>/</button>
        <button>*</button>
        <button>=</button>
        </div>

        </div>



    </section>



    <script src="/js/calculator.js"></script>
    
</body>
</html>
